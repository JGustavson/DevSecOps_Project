<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%232f5bea%27/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f2f4f7; --surface: #ffffff; --ink: #14202e; --muted: #667085;
    --line: #d9dee5; --accent: #2f5bea; --on-accent: #ffffff; --danger: #b42318;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1620; --surface: #17212d; --ink: #e8edf3; --muted: #98a2b3;
    --line: #2a3646; --accent: #7d9cff; --on-accent: #0f1620; --danger: #f97066;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1620; --surface: #17212d; --ink: #e8edf3; --muted: #98a2b3;
      --line: #2a3646; --accent: #7d9cff; --on-accent: #0f1620; --danger: #f97066;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.75rem; }
  h1 { font-size: 2.25rem; line-height: 1.1; letter-spacing: -0.02em; margin: 0; }
  .theme {
    flex: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 0.35rem 0.7rem; font-size: 0.85rem; white-space: nowrap;
  }
  form { display: grid; gap: 0.5rem; margin-bottom: 1.75rem; }
  input[type="text"], input[type="password"] {
    font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 0.65rem 0.8rem; width: 100%;
  }
  input::placeholder { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .add {
    justify-self: start; background: var(--accent); color: var(--on-accent);
    border: 0; border-radius: 6px; padding: 0.55rem 1rem; font-weight: 600;
  }
  .buttons, .actions { display: flex; gap: 0.5rem; }
  .secondary {
    background: none; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 0.55rem 1rem;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filters { display: flex; gap: 1.25rem; border-bottom: 1px solid var(--line); margin-bottom: 0.25rem; }
  .filters button {
    background: none; border: 0; padding: 0.4rem 0; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .filters button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
  li input[type="checkbox"] {
    appearance: none; flex: none; width: 1.35rem; height: 1.35rem; margin: 0.15rem 0 0;
    border: 2px solid var(--muted); border-radius: 50%; cursor: pointer; background: transparent;
  }
  li input[type="checkbox"]:checked {
    border-color: var(--accent); background: var(--accent);
    box-shadow: inset 0 0 0 3px var(--bg);
  }
  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .desc { display: block; color: var(--muted); font-size: 0.9rem; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  .remove { background: none; border: 0; color: var(--muted); padding: 0.1rem 0.4rem; font-size: 0.9rem; }
  .remove:hover { color: var(--danger); }
  .empty, .error { margin: 1.25rem 0 0; }
  .empty { color: var(--muted); }
  .error { color: var(--danger); }
  @media (prefers-reduced-motion: no-preference) {
    li input[type="checkbox"] { transition: background 0.15s, border-color 0.15s; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="heading">To-do</h1>
    <div class="actions">
      <button type="button" class="theme" id="signout" hidden>Sign out</button>
      <button type="button" class="theme" id="theme"></button>
    </div>
  </header>

  <form id="auth-form" hidden>
    <input type="text" id="username" placeholder="Username" autocomplete="username" maxlength="50" required aria-label="Username">
    <input type="password" id="password" placeholder="Password (8+ characters)" autocomplete="current-password" maxlength="128" required aria-label="Password">
    <div class="buttons">
      <button class="add" type="submit">Sign in</button>
      <button class="secondary" type="button" id="register">Create account</button>
    </div>
  </form>

  <div id="todos-view" hidden>
  <form id="add-form">
    <input type="text" id="title" placeholder="What needs doing?" maxlength="200" required aria-label="Task title">
    <input type="text" id="description" placeholder="Details (optional)" aria-label="Task details">
    <button class="add" type="submit">Add task</button>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="open" aria-pressed="false">Open</button>
    <button type="button" data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden></p>
  </div>
  <p class="error" id="error" role="alert" hidden></p>
</main>

<script>
  function storedToken() {
    try { return sessionStorage.getItem("token"); } catch (e) { return null; }
  }
  const state = { todos: [], filter: "all", token: storedToken() };
  const $ = (id) => document.getElementById(id);

  async function api(url, options = {}) {
    const headers = { "Content-Type": "application/json" };
    if (state.token) headers.Authorization = "Bearer " + state.token;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401 && state.token) {
      signOut("Your session expired. Sign in again.");
      const expired = new Error("Session expired");
      expired.signedOut = true;
      throw expired;
    }
    if (!res.ok) {
      const taskTitleIssue = res.status === 422 && url.startsWith("/todos");
      const err = new Error(taskTitleIssue ? "Enter a title for the task." : "Something went wrong (" + res.status + "). Try again.");
      err.status = res.status;
      throw err;
    }
    return res.status === 204 ? null : res.json();
  }

  const request = (path, options) => api("/todos" + path, options);

  function showError(message) {
    $("error").textContent = message || "";
    $("error").hidden = !message;
  }

  async function run(action) {
    showError("");
    try {
      await action();
    } catch (err) {
      if (!err.signedOut) showError(err.message);
    }
    render();
  }

  function render() {
    const signedIn = Boolean(state.token);
    $("auth-form").hidden = signedIn;
    $("todos-view").hidden = !signedIn;
    $("signout").hidden = !signedIn;
    if (!signedIn) {
      $("heading").textContent = "Sign in";
      return;
    }

    const open = state.todos.filter((t) => !t.completed).length;
    $("heading").textContent = !state.todos.length
      ? "No tasks yet"
      : open === 0 ? "All done" : open + (open === 1 ? " task open" : " tasks open");

    const visible = state.todos.filter((t) =>
      state.filter === "all" || (state.filter === "done") === t.completed);

    const list = $("list");
    list.replaceChildren();
    for (const todo of visible) {
      const li = document.createElement("li");
      li.className = todo.completed ? "done" : "";

      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = todo.completed;
      box.setAttribute("aria-label", "Mark \"" + todo.title + "\" as " + (todo.completed ? "open" : "done"));
      box.addEventListener("change", () => run(async () => {
        const updated = await request("/" + todo.id, { method: "PATCH", body: JSON.stringify({ completed: box.checked }) });
        Object.assign(todo, updated);
      }));

      // textContent only: task text is never parsed as HTML
      const text = document.createElement("div");
      text.className = "text";
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = todo.title;
      text.append(title);
      if (todo.description) {
        const desc = document.createElement("span");
        desc.className = "desc";
        desc.textContent = todo.description;
        text.append(desc);
      }

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "remove";
      remove.textContent = "Delete";
      remove.setAttribute("aria-label", "Delete \"" + todo.title + "\"");
      remove.addEventListener("click", () => run(async () => {
        await request("/" + todo.id, { method: "DELETE" });
        state.todos = state.todos.filter((t) => t.id !== todo.id);
      }));

      li.append(box, text, remove);
      list.append(li);
    }

    const empty = $("empty");
    empty.hidden = visible.length > 0;
    empty.textContent = state.todos.length
      ? "No " + state.filter + " tasks."
      : "Add your first task above.";
  }

  $("add-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const title = $("title").value.trim();
    const description = $("description").value.trim();
    if (!title) return;
    run(async () => {
      const created = await request("", { method: "POST", body: JSON.stringify({ title, description: description || null }) });
      state.todos.push(created);
      $("add-form").reset();
      $("title").focus();
    });
  });

  document.querySelectorAll("[data-filter]").forEach((button) => {
    button.addEventListener("click", () => {
      state.filter = button.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((b) =>
        b.setAttribute("aria-pressed", String(b === button)));
      render();
    });
  });

  const root = document.documentElement;
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
  const activeTheme = () => root.dataset.theme || (prefersDark.matches ? "dark" : "light");

  function syncThemeButton() {
    $("theme").textContent = activeTheme() === "dark" ? "Light mode" : "Dark mode";
  }

  $("theme").addEventListener("click", () => {
    const next = activeTheme() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) { /* storage unavailable */ }
    syncThemeButton();
  });
  prefersDark.addEventListener("change", syncThemeButton);
  syncThemeButton();

  function setToken(token) {
    state.token = token;
    try { sessionStorage.setItem("token", token); } catch (e) { /* storage unavailable */ }
  }

  function signOut(message) {
    state.token = null;
    state.todos = [];
    try { sessionStorage.removeItem("token"); } catch (e) { /* storage unavailable */ }
    showError(message || "");
  }

  async function authenticate(mode) {
    const username = $("username").value.trim();
    const password = $("password").value;
    if (!username || !password) return;
    showError("");
    try {
      const body = JSON.stringify({ username, password });
      if (mode === "register") await api("/auth/register", { method: "POST", body });
      const data = await api("/auth/login", { method: "POST", body });
      setToken(data.access_token);
      $("auth-form").reset();
      state.todos = await request("", { method: "GET" });
    } catch (err) {
      if (!err.signedOut) {
        showError({
          401: "Incorrect username or password.",
          409: "That username is taken.",
          422: "Use a username of 3+ letters, numbers, or . _ - and a password of 8+ characters.",
        }[err.status] || err.message);
      }
    }
    render();
  }

  $("auth-form").addEventListener("submit", (event) => {
    event.preventDefault();
    authenticate("login");
  });
  $("register").addEventListener("click", () => authenticate("register"));
  $("signout").addEventListener("click", () => { signOut(); render(); });

  if (state.token) {
    run(async () => { state.todos = await request("", { method: "GET" }); });
  } else {
    render();
  }
</script>
</body>
</html>
