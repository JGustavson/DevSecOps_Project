name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=main --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  container-scan:
    name: Build and scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t todo-api:ci .

      # Export the image to a tarball so the scanner never needs the Docker socket
      - name: Export image
        run: docker save -o image.tar todo-api:ci

      # Run Trivy from its official image instead of a third-party action.
      # 0.69.3 is a version the maintainers list as safe after the March 2026
      # supply-chain incident, and the digest below pins that exact image.
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --input /work/image.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      # Tests are excluded because Bandit flags every `assert` in them
      - name: Scan source code
        run: bandit -r . --exclude ./.venv,./test_main.py --severity-level medium

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the app
        run: |
          docker build -t todo-api:ci .
          docker run -d --name todo-api -p 8000:8000 todo-api:ci

      - name: Wait for the app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/todos > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not start in time"
          docker logs todo-api
          exit 1

      - name: Prepare report directory
        run: |
          mkdir zap-wrk
          chmod 777 zap-wrk

      # Official ZAP image run directly instead of a third-party action.
      # The baseline scan is passive (spider + passive rules), so it is safe to
      # run on every push. -I keeps warnings from failing the build; see the
      # report for findings. Pin this image to a digest once you have verified one.
      - name: Run ZAP baseline scan
        run: |
          docker run --rm --network host \
            -v "$PWD/zap-wrk:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 -r report.html -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-wrk/report.html

      - name: Stop the app
        if: always()
        run: docker rm -f todo-api